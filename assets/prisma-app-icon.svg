<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#221f3a"/>
      <stop offset="1" stop-color="#07060d"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <circle id="r" cx="256" cy="194" r="100"/>
    <circle id="g" cx="198" cy="294" r="100"/>
    <circle id="b" cx="314" cy="294" r="100"/>
    <clipPath id="cr"><use href="#r"/></clipPath>
    <clipPath id="cg"><use href="#g"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g filter="url(#glow)" opacity=".75">
      <use href="#r" fill="#FF2E4D"/><use href="#g" fill="#2EE66B"/><use href="#b" fill="#2E6BFF"/>
    </g>
    <use href="#r" fill="#FF2E4D"/>
    <use href="#g" fill="#2EE66B"/>
    <use href="#b" fill="#2E6BFF"/>
    <g clip-path="url(#cr)"><use href="#g" fill="#FFE14D"/><use href="#b" fill="#E44DFF"/></g>
    <g clip-path="url(#cg)"><use href="#b" fill="#3DE8FF"/></g>
    <g clip-path="url(#cr)"><g clip-path="url(#cg)"><use href="#b" fill="#FFFFFF"/></g></g>
    <rect width="512" height="256" fill="url(#gloss)"/>
  </g>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
